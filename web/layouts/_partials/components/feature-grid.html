<section class="mx-auto w-full px-4 py-4 sm:px-6 lg:max-w-7xl lg:py-8">
  <div class="font-mono text-xs font-semibold tracking-widest text-teal-600 sm:text-sm">
    FEATURES
  </div>
  <h2 class="mt-3 text-2xl font-bold tracking-tight text-gray-900 sm:text-3xl">
    A modular toolkit for coupled simulation
  </h2>
  <p class="mt-2 max-w-2xl text-base text-gray-500 sm:text-lg">
    {{ markdownify .Params.feature_intro }}
  </p>
  <div class="mt-8 grid gap-5 md:grid-cols-2 lg:grid-cols-3">
    {{ range .Params.features }}
    <div class="overflow-hidden rounded-xl border border-gray-200">
      {{ with .visual }}
      <div class="aspect-[21/9] md:aspect-[16/9]">
        <img src="{{ .permalink }}" alt="{{ .alt }}" loading="lazy" class="h-full w-full object-cover">
      </div>
      {{ end }}
      <div class="p-5">
        <h3 class="text-base font-semibold text-gray-900">{{ .headline }}</h3>
        <p class="mt-1.5 text-sm leading-relaxed text-gray-500">{{ .summary }}</p>
      </div>
    </div>
    {{ end }}
  </div>
</section>
