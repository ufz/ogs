{{ .page.Scratch.Add "numGalleries" 1}}
{{ $i := .page.Scratch.Get "numGalleries" }}
<div class="flex flex-wrap gap-4 text-center">
  {{ $length := len .gallery }}
  {{ range .gallery }}
  <div class="min-w-0 flex-1">
    <a href="{{ .permalink }}" data-fancybox="gallery-{{ $i }}" data-caption="{{ .caption | default ""}}">
      <img class="rounded shadow-lg" src="{{ .permalink }}.thumbnail_box_3" alt="{{ .caption | default ""}}" />
    </a>
  </div>
  {{ end }}
</div>
