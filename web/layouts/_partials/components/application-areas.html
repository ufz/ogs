<section class="mx-auto w-full px-4 py-12 sm:px-6 lg:max-w-7xl lg:py-16">
  <div class="font-mono text-xs font-semibold tracking-widest text-teal-600 sm:text-sm">
    APPLICATION AREAS
  </div>
  <h2 class="mt-3 text-2xl font-bold tracking-tight text-gray-900 sm:text-3xl">
    Where OpenGeoSys is put to work
  </h2>
  <p class="mt-2 max-w-2xl text-base text-gray-500 sm:text-lg">
    {{ .Params.application_areas_intro }}
  </p>
  <div class="mt-8 grid gap-5 md:grid-cols-3">
    {{ range .Params.application_areas }}
    <div class="overflow-hidden rounded-xl border border-gray-200">
      <div class="aspect-[4/3]">
        <img src="{{ .visual.permalink }}" alt="{{ .visual.alt }}" loading="lazy"
          class="h-full w-full object-cover">
      </div>
      <div class="p-5">
        <div class="font-mono text-[11px] tracking-wide text-teal-600">{{ upper .eyebrow }}</div>
        <div class="mt-2 text-lg font-bold tracking-tight text-gray-900">{{ .headline }}</div>
        <p class="mt-2 text-sm leading-relaxed text-gray-500">{{ .textline }}</p>
      </div>
    </div>
    {{ end }}
  </div>
</section>
