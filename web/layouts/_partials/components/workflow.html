<section class="border-t border-gray-200 bg-gray-50 px-4 py-12 text-gray-900 sm:px-6 lg:px-8 lg:py-16">
  <div class="mx-auto w-full lg:max-w-7xl">
    <div class="font-mono text-xs font-semibold tracking-widest text-teal-700 sm:text-sm">
      INTEGRATED WORKFLOWS
    </div>
    <h2 class="mt-3 text-2xl font-bold tracking-tight text-gray-900 sm:text-3xl">
      From input data to results
    </h2>
    <p class="mt-2 max-w-2xl text-base text-gray-600 sm:text-lg">
      {{ .Params.workflow_intro }}
    </p>
    <div class="mt-8 flex flex-col items-stretch lg:flex-row">
      {{ range $i, $step := .Params.workflow_steps }}
      {{ if gt $i 0 }}
      <div class="flex items-center justify-center py-2 text-teal-700 lg:w-11 lg:py-0">
        <span class="lg:hidden" aria-hidden="true">&darr;</span>
        <span class="hidden text-xl lg:inline" aria-hidden="true">&rarr;</span>
      </div>
      {{ end }}
      <div class="flex-1 rounded-lg border border-gray-200 border-t-4 bg-white p-5"
        style="border-top-color: {{ index (slice "#104EB2" "#0E7C88" "#0D6A8F" "#0F8B93") $i }};">
        <div class="font-mono text-xs font-semibold tracking-wide text-teal-700">{{ $step.number }}</div>
        <div class="mt-2 text-base font-semibold text-gray-900">{{ $step.headline }}</div>
        <p class="mt-2 text-sm leading-relaxed text-gray-600">{{ $step.textline }}</p>
      </div>
      {{ end }}
    </div>
  </div>
</section>
