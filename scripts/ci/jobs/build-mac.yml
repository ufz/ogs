build mac:
  tags: [mac, arm64]
  extends:
    - .template-build-linux
    - .test-artifacts
  needs: [meta]
  timeout: 3h
  variables:
    CTEST_TIMEOUT: 90 # passing runs need ~4490 s, the default 75 min is 4500 s
    CHECK_WARNINGS: "true"
    CMAKE_PRESET: release-all
    CMAKE_ARGS: >-
      -DOGS_BUILD_HDF5=ON
