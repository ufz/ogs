linux ctest large:
  extends:
    - .template-build-linux
    - .test-artifacts
  tags: [shell, envinf]
  needs: [meta]
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: never
    - when: manual
      allow_failure: true
  timeout: 3h
  variables:
    BUILD_TESTS: "false"
    BUILD_CTEST_LARGE: "true"
    CMAKE_PRESET: release-all
    CMAKE_ARGS: >-
      -DOGS_USE_MKL=ON
      -DOGS_USE_NETCDF=ON
  before_script:
    - source /opt/intel/oneapi/setvars.sh

build linux (no unity):
  extends:
    - .template-build-linux
  tags: [shell, envinf]
  needs: [meta]
  timeout: 3h
  variables:
    BUILD_TESTS: "false"
    BUILD_CTEST: "false"
    CHECK_WARNINGS: "true"
    CMAKE_PRESET: ci-no-unity

build linux debug with sanitizers:
  extends:
    - .template-build-linux
    - .test-artifacts
  tags: [envinf, shell]
  needs: [meta]
  variables:
    CMAKE_PRESET: sanitizer
    CMAKE_ARGS: >-
      -DOGS_CTEST_MAX_RUNTIME=60
      -DOGS_BUILD_PROCESSES=SteadyStateDiffusion

build linux ubuntu perf:
  extends:
    - .template-build-linux
    - .test-artifacts
    - .rules-master-manual
  tags: [shell, ubuntu]
  needs: [meta]
  variables:
    CMAKE_PRESET: release-all
    CTEST_PARALLEL_LEVEL: 1 # Run ctests serially
    CTEST_TIMEOUT: 480
    OGS_PERFORMANCE_TESTS_ALLOWED_TO_FAIL: false

build with uv:
  stage: build
  tags: [shell, envinf]
  needs: [meta]
  extends:
    - .test-artifacts
  variables:
    GIT_DEPTH: 1000
    CTEST_BINARY_DIRECTORY: ../build/_skbuild/uv
  script:
    - rm -rf .venv ../build/_skbuild  # cleanup build dirs
    - |
      export CTEST_GROUP=Experimental
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        export CTEST_GROUP=master
      fi
      export CTEST_DASHBOARD_PHASE=uv-build
      ctest -S scripts/ci/ctest-dashboard.cmake -VV
    - ln -s ../build/_skbuild build # .test-artifacts expects a directory "build"
    - |
      if [ "$BUILD_TESTS" = true ]; then
        uv run --no-sync pytest
      fi
    - |
      if [ "$BUILD_CTEST" = true ]; then
        export CTEST_DASHBOARD_PHASE=test
        uv run --no-sync ctest -S scripts/ci/ctest-dashboard.cmake -VV
      fi

build in devcontainer:
  extends:
    - .rules-master-manual
  stage: build
  tags: [shell, envinf, podman]
  needs: [meta]
  script:
    - rm -rf ../build/devcontainer-release-all
    # Podman feature builds can leave /tmp unwritable by _apt. Use /var/tmp
    # during the build: https://github.com/devcontainers/features/issues/1480
    - |
      python3 - <<'PYCONFIG'
      import json
      import os
      from pathlib import Path

      config = json.loads(Path(".devcontainer.json").read_text())
      job_id = os.environ["CI_JOB_ID"]
      config_dir = Path(f".ci-devcontainer-{job_id}")
      config_dir.mkdir(exist_ok=True)
      dockerfile = config_dir / "Dockerfile"
      dockerfile.write_text(f"FROM {config.pop('image')}\nENV TMPDIR=/var/tmp\n")
      config["build"] = {"dockerfile": dockerfile.name}
      config.setdefault("runArgs", []).append("--tmpfs=/tmp:rw,exec,nosuid,nodev,mode=1777")
      (config_dir / "devcontainer.json").write_text(json.dumps(config))
      PYCONFIG
    - devcontainer up --docker-path podman --workspace-folder . --config ".ci-devcontainer-${CI_JOB_ID}/devcontainer.json"
    - devcontainer exec --docker-path podman --workspace-folder . --config ".ci-devcontainer-${CI_JOB_ID}/devcontainer.json" cmake --preset release-all
    - devcontainer exec --docker-path podman --workspace-folder . --config ".ci-devcontainer-${CI_JOB_ID}/devcontainer.json" cmake --build --preset release-all
    - devcontainer exec --docker-path podman --workspace-folder . --config ".ci-devcontainer-${CI_JOB_ID}/devcontainer.json" cmake --build --preset release-all -t tests
  after_script:
    - podman ps --filter "label=devcontainer.local_folder=$(pwd)" --quiet | xargs -r -I {} sh -c ' podman stop {} && podman rm {}'
    - rm -f ".ci-devcontainer-${CI_JOB_ID}/devcontainer.json" ".ci-devcontainer-${CI_JOB_ID}/Dockerfile"
    - rmdir ".ci-devcontainer-${CI_JOB_ID}" 2>/dev/null || true

build linux clang:
  stage: build
  extends:
    - .template-build-linux
    - .test-artifacts
  tags: [shell, envinf]
  needs: [meta]
  variables:
    CMAKE_PRESET: clang-release
